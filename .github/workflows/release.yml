name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build watchtower.gemspec
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.gem'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.gem --generate-notes --verify-tag
      - name: Publish to GitHub Packages
        env:
          GEM_HOST_API_KEY: ${{ github.token }}
        run: gem push --host https://rubygems.pkg.github.com/watchtowerobservability *.gem
